<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: two build sheets side by side, each a spec card with a four-axis performance graph; one column on phones. */
:root {
  --bg: #f1f3f5; --panel: #ffffff; --ink: #14202b; --muted: #5d6b78; --line: #d3dae0; --row: #f6f8fa;
  --accent: #0b5cad; --accent-ink: #ffffff; --ref: #8794a1; --warn: #a15c00; --bad: #b3261e;
  --display: "Barlow Semi Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f161c; --panel: #17202a; --ink: #e8eef3; --muted: #9aa8b5; --line: #2a3744; --row: #1c2733; --accent: #6aa9f0; --accent-ink: #0a1a2b; --ref: #7d8b99; --warn: #f0b35a; --bad: #f2877f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f161c; --panel: #17202a; --ink: #e8eef3; --muted: #9aa8b5; --line: #2a3744; --row: #1c2733; --accent: #6aa9f0; --accent-ink: #0a1a2b; --ref: #7d8b99; --warn: #f0b35a; --bad: #f2877f; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
h1 { font: 700 26px/1.1 var(--display); margin: 0; }
h2 { font: 700 22px/1.15 var(--display); margin: 0; }
h3 { font: 600 13px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
.top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; }
.tag { font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; color: var(--muted); }
.note { color: var(--muted); margin: 0; max-width: 72ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; }
.head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: 13px; }
.cls { font: 700 30px/1 var(--display); border: 2px solid var(--ink); border-radius: 4px; padding: 4px 10px; white-space: nowrap; }
.field { display: grid; gap: 3px; min-width: 0; }
label, .lbl { font-size: 12px; color: var(--muted); }
input[type=text], input[type=number], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; min-width: 0; width: 100%; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.graph { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 12px; align-items: center; }
@media (max-width: 520px) { .graph { grid-template-columns: minmax(0, 1fr); } }
svg { width: 100%; height: auto; display: block; max-width: 260px; margin: 0 auto; }
.ax { stroke: var(--line); fill: none; } .ring { stroke: var(--line); fill: none; stroke-width: 1; }
.poly { fill: var(--accent); fill-opacity: .22; stroke: var(--accent); stroke-width: 2; }
.refp { fill: none; stroke: var(--ref); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg text { fill: var(--muted); font: 600 11px var(--display); letter-spacing: .04em; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; margin-top: 4px; justify-content: center; }
.sw { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 5px; }
.sw.d { border-top: 2px dashed var(--ref); }
.part { display: grid; grid-template-columns: minmax(110px, 1.1fr) 110px minmax(0, 1.2fr) auto; gap: 6px; align-items: center; margin: 4px 0; }
.part .n { font-size: 14px; display: flex; align-items: center; gap: 8px; }
.ic, .part .n .ic, .lbl .ic { width: 22px; height: 22px; max-width: none; margin: 0; flex: none; color: var(--muted); }
.part .n { justify-content: flex-start; text-align: left; }
.lbl .ic { display: inline-block; vertical-align: -6px; margin-right: 6px; }
button.x { font: 600 15px var(--body); background: none; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); cursor: pointer; height: 30px; }
.calc { font-variant-numeric: tabular-nums; font-weight: 600; padding: 5px 0; }
.warn { color: var(--warn); font-size: 12px; }
.row2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
button.btn { font: 600 14px var(--body); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer; }
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0 18px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.kv .val { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.tag.done { color: var(--accent); border-color: var(--accent); }
details.grp { border-top: 1px solid var(--line); padding: 6px 0; }
details.grp > summary { display: flex; gap: 10px; align-items: center; cursor: pointer; flex-wrap: wrap; }
details.grp > summary .gn { font-weight: 600; min-width: 150px; }
details.grp > summary select { margin-left: auto; width: auto; }
details.grp .part { padding-left: 14px; }
button.btn.danger { color: var(--bad); border-color: var(--bad); }
.bad { color: var(--bad); }
.addpart { display: flex; gap: 8px; padding: 6px 0 2px 14px; }
.addpart input { max-width: 260px; }
.part.c { grid-template-columns: minmax(110px, 1.1fr) 110px minmax(0, 1.2fr) 28px; }
.seg { display: inline-flex; } .segb { border-radius: 0; } .segb:first-child { border-radius: 4px 0 0 4px; } .segb:last-child { border-radius: 0 4px 4px 0; margin-left: -1px; }
.segb[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
body { padding-block: 8px; }
.bar { display: flex; gap: 8px 10px; align-items: flex-end; flex-wrap: wrap; }
.bar .field { flex: 1 1 260px; }
.msgline { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.msgline.dirty { color: var(--warn); }
.msgline.ok { color: var(--accent); }
</style></head><body>
<div class="wrap">
  <div class="card"><div class="bar"><div class="field"><label for="bname">Build name</label><input type="text" id="bname" maxlength="80" autocomplete="off" placeholder="For example Daytona Sport spec"></div>
    <button class="btn primary" type="button" id="bsave">Save build</button><button class="btn" type="button" id="bcopy">Save as a copy</button></div>
    <div class="msgline" id="bmsg" role="status"></div></div>
  <div class="row2" style="margin-top:0"><span class="lbl">Units</span><div class="seg" role="group" aria-label="Units"><button type="button" class="btn segb" data-units="imp" aria-pressed="true">Imperial · hp, lb-ft, lbs</button><button type="button" class="btn segb" data-units="met" aria-pressed="false">Metric · kW, N·m, kg</button></div><span class="sub">Engine size stays in litres either way.</span></div>
  <div class="cards" id="cards"></div>
</div>

function icon(name){return '<svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+(ICONS[name]||ICONS._custom)+'</svg>';}

  var TIERS = ["", "Stock", "Street", "Sport", "Race"];
  var EXTRA_TIERS = { "Tire Compound": ["Drag"], "Spring and Dampers": ["Drag"] };
  var WHEEL_GROUPS = ["A", "B–G", "H–K", "L–Q", "R", "S–V", "W–Z"];
  var ORDER = ["Fuel and Air", "Engine", "Platform and Handling", "Tires", "Wheels", "Drivetrain", "Aero and Appearance", "Conversion"];
  var NO_ADD = ["Engine", "Platform and Handling", "Tires", "Drivetrain"]; // categories with no "Add part" box
  var ADD_HINT = { "Fuel and Air": "Eg Turbo", "Conversion": "Eg Bodykit" };
  var ONLY_TIERS = { "Front Tire Width": ["Stock", "Upgraded"], "Rear Tire Width": ["Stock", "Upgraded"] };
  var WEIGHTS = ["Extra light", "Light", "Medium", "Heavy", "Extra heavy"];
  function isBallast(p) { return p.group === "Platform and Handling" && p.name === "Ballast"; }
  // Tiers each part can take: Ballast is Stock/Installed, tire widths and Conversion parts are Stock/Upgraded.
  function allowed(p) {
    if (isBallast(p)) return ["Stock", "Installed"];
    if (ONLY_TIERS[p.name]) return ONLY_TIERS[p.name];
    if (p.group === "Conversion") return ["Stock", "Upgraded"];
    return TIERS.concat(EXTRA_TIERS[p.name] || []);
  }
  // Detail is kept only where the game gives us something to record: Ballast weight, an upgraded width, Aero, added parts.
  function detailKind(p) {
    if (isBallast(p)) return p.tier === "Installed" ? "weight" : "";
    if (ONLY_TIERS[p.name]) return p.tier === "Upgraded" ? "width" : "";
    if (p.group === "Conversion") return "";
    return p.group === "Aero and Appearance" || p.custom ? "text" : "";
  }
  function detailOf(p) { return detailKind(p) ? p.detail : ""; }
  function detailCell(p, i) {
    var k = detailKind(p), a = ' aria-label="' + esc(p.name) + ' detail" data-i="' + i + '" data-k="detail"';
    if (k === "weight") return '<select' + a + '><option value="">Weight</option>' + WEIGHTS.map(function (w) { return '<option value="' + w + '"' + (w === p.detail ? " selected" : "") + ">" + w + "</option>"; }).join("") + "</select>";
    if (k) return '<input type="text"' + a + ' value="' + esc(p.detail) + '" placeholder="' + (k === "width" ? "Width" : "Detail") + '">';
    return "<span></span>";
  }
  // Quick build / "Set all to" use the normal tiers; a width only follows when the choice is Stock.
  function applyTier(p, v) { if (allowed(p).indexOf(v) < 0) return; p.tier = v; p.detail = ""; }
  // Older sheets (and the samples) may hold a width with no tier: Upgraded when a size was typed, otherwise Stock.
  // Wheels are Stock or Upgraded. Older sheets become Upgraded when a group, style or note was filled in.
  function fixWheels(b) {
    if (b.wheelState === "Stock" || b.wheelState === "Upgraded") return;
    var st = String(b.wheelStyle || "").trim().toLowerCase();
    b.wheelState = b.wheelGroup || b.wheelNote || (st && st !== "stock") ? "Upgraded" : "Stock";
  }
  // Parts always list in the game's order: the standard parts first, then Turbo/Supercharger and Intercooler,

      if (e.target.closest("[data-delno]")) { c.querySelector("[data-delbar]").innerHTML = '<button class="btn danger" type="button" data-del>Delete build sheet…</button>'; return; }
      if (e.target.closest("[data-delyes]")) { send({ fcm: "delete" }); return; }
      if (e.target.closest("[data-export]")) {
        var box = c.querySelector("[data-exportbox]");
        if (!box) { box = document.createElement("div"); box.setAttribute("data-exportbox", ""); box.style.marginTop = "12px"; c.appendChild(box); }
        box.innerHTML = '<textarea readonly rows="14" style="width:100%;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace" aria-label="Exported build" data-extext></textarea><div class="row2" style="margin-top:6px"><button class="btn" type="button" data-copy>Copy</button><button class="btn" type="button" data-exclose>Close</button><span class="sub" data-exmsg></span></div>';
        var ta = box.querySelector("[data-extext]"); ta.value = exportText(); ta.focus(); ta.select(); return;
      }
      if (e.target.closest("[data-exclose]")) { var bx = c.querySelector("[data-exportbox]"); if (bx) bx.remove(); return; }
      if (e.target.closest("[data-copy]")) {
        var ta2 = c.querySelector("[data-extext]"), mg = c.querySelector("[data-exmsg]"); ta2.select();
        var done = function (ok) { mg.textContent = ok ? "Copied." : "Press Ctrl+C to copy."; };
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta2.value).then(function () { done(true); }, function () { done(document.execCommand("copy")); }); else done(document.execCommand("copy")); } catch (err) { done(false); }
        return;
      }
      if (e.target.closest("[data-done]")) { b.done = true; draw(); }
      if (e.target.closest("[data-reopen]")) { b.done = false; draw(); }
    });
    c._redraw = function () { saveOpen(); draw(); };
    c._b = b; fixWidths(b); fixWheels(b); fixOrder(b);
    draw(); return c;
  }
  var PI_CLASSES = [["E", 100, 300], ["D", 301, 400], ["C", 401, 500], ["B", 501, 600], ["A", 601, 700], ["S", 701, 800], ["R", 801, 900], ["P", 901, 998], ["X", 999, 999]];
  function classFor(pi) { for (var i = 0; i < PI_CLASSES.length; i++) if (pi >= PI_CLASSES[i][1] && pi <= PI_CLASSES[i][2]) return PI_CLASSES[i][0]; return ""; }

  function send(m) { try { parent.postMessage(m, "*"); } catch (e) {} }
  var host = document.getElementById("cards"), seq = 0, cur = null, dirty = false, bname = document.getElementById("bname"), bmsg = document.getElementById("bmsg");
  function status(t, cls) { bmsg.textContent = t; bmsg.className = "msgline" + (cls ? " " + cls : ""); }
  function markDirty() { if (!dirty) { dirty = true; status("Unsaved changes", "dirty"); send({ fcm: "dirty" }); } }
  function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }
  function setUnits(u) { unitSys = u; document.querySelectorAll("[data-units]").forEach(function (x) { x.setAttribute("aria-pressed", x.dataset.units === u ? "true" : "false"); }); }
  setUnits(store(function (ls) { return ls.getItem("fcm.units"); }) === "met" ? "met" : "imp");
  function show(b) {
    fixWidths(b); fixWheels(b); fixOrder(b);
    host.innerHTML = ""; cur = render(b, seq++); host.appendChild(cur);
  }
  // A catalogue car (a row of the cars table) becomes a fresh draft: stock PI, class, engine, power, torque and weight filled in.
  function carToBuild(c) {
    var num = function (v) { return v == null || v === "" ? 0 : Number(v); };
    var st = { speed: num(c.speed), braking: num(c.braking), handling: num(c.handling), accel: num(c.acceleration) };
    var all = []; Object.keys(PARTS).forEach(function (g) { PARTS[g].forEach(function (n) { all.push(P(g, n, "Stock")); }); });
    var forced = c.induction === "T" || c.induction === "TT" ? "Turbo" : (c.induction === "PDS" || c.induction === "CS" ? "Supercharger" : "");
    if (forced) {
      var at = -1; all.forEach(function (p, i) { if (p.group === "Fuel and Air" && p.name === "Intake Manifold and Throttle Body") at = i; });
      all.splice(at + 1, 0, P("Fuel and Air", forced, "Stock"), P("Fuel and Air", "Intercooler", "Stock"));
    }
    var dsp = c.displacement_l == null ? "" : String(Number(c.displacement_l));
    return { title: c.year + " " + c.make + " " + c.model, sub: "", cat: { pi: num(c.pi), hp: num(c.power_hp), tq: num(c.torque_ftlb), lb: num(c.mass_lb), dsp: dsp },
      cls: classFor(num(c.pi)), pi: num(c.pi), engine: dsp ? dsp + "L" : "", hp: num(c.power_hp), tq: num(c.torque_ftlb), lb: num(c.mass_lb), dist: "",
      stock: st, built: JSON.parse(JSON.stringify(st)), wheelStyle: "Stock", rimF: "Stock", rimR: "Stock", parts: all, done: false };
  }
  document.querySelectorAll("[data-units]").forEach(function (u) { u.addEventListener("click", function () {
    setUnits(u.dataset.units); store(function (ls) { ls.setItem("fcm.units", u.dataset.units); });
    if (cur) cur._redraw();
  }); });
  ["input", "change", "click"].forEach(function (ev) { host.addEventListener(ev, function (e) { if (ev !== "click" || (e.target.closest && e.target.closest("button, summary"))) markDirty(); }); });
  bname.addEventListener("input", markDirty);
  function doSave(copy) {
    if (!cur) return;
    var n = bname.value.trim(); if (!n) { status("Give the build a name first", "dirty"); bname.focus(); return; }
    status("Saving…"); send({ fcm: "save", name: n, data: cur._b, copy: !!copy });
  }
  document.getElementById("bsave").addEventListener("click", function () { doSave(false); });
  document.getElementById("bcopy").addEventListener("click", function () { doSave(true); });
  window.addEventListener("message", function (e) {
    if (e.source !== parent) return;
    var m = e.data; if (!m || typeof m !== "object") return;
    if (m.fcm === "new" && m.car) { var b = carToBuild(m.car); show(b); bname.value = m.name || b.title; dirty = false; status("New build. Not saved yet.", "dirty"); }
    else if (m.fcm === "load" && m.data) { show(m.data); bname.value = m.name || ""; dirty = false; status(""); }
    else if (m.fcm === "saved") { dirty = false; if (m.name) bname.value = m.name; status("Saved.", "ok"); }
    else if (m.fcm === "error") { status(m.message || "Could not save.", "dirty"); }
  });
  var lastH = 0;
  function reportHeight() { var h = Math.ceil(document.documentElement.getBoundingClientRect().height); if (h !== lastH) { lastH = h; send({ fcm: "height", h: h }); } }
  if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener("load", reportHeight);
  send({ fcm: "ready" });
})();
</script></body></html>
